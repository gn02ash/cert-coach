# For the app's own pages only. The API's responses don't get it, because a PDF opened from the API is shown
# by the browser's PDF viewer, which a strict policy (object-src 'none') would block.
#
# The app loads only its own scripts and styles. Images may be data: URIs (the favicon). Nothing may frame it,
# and forms post only to this origin.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
