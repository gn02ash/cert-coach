# Serves the React app and proxies everything the API owns, so the browser sees one origin
# and the session cookie stays first-party.
server {
    listen 80;
    root /usr/share/nginx/html;
    server_tokens off;

    location ~ ^/(api|auth|mcp|signin-oidc|signin-google|health)(/|$) {
        include /etc/nginx/security-headers.conf;

        # PDF uploads go up to 50 MB; the API enforces the exact limit per endpoint.
        client_max_body_size 52m;
        proxy_pass http://api:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Answers stream as server-sent events; buffering would hold them back until the end.
        proxy_buffering off;
    }

    # Hashed build assets never change.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        include /etc/nginx/app-csp.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routes fall back to the app shell.
    location / {
        include /etc/nginx/security-headers.conf;
        include /etc/nginx/app-csp.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
